name: Feature
description: Anforderung, Idee oder neue Funktionalität
title: "[Feature]: "
labels: ["feature"]
body:
  - type: input
    id: repository
    attributes:
      label: Ziel-Repository
      placeholder: z. B. artaker/internes-tool
    validations:
      required: true
  - type: input
    id: business_unit
    attributes:
      label: Business Unit / Team
      placeholder: z. B. Application Services, Infrastructure, SAP
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem / Ziel
      description: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Vorgeschlagene Lösung
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      placeholder: "- [ ] …"
    validations:
      required: true
